name: tests

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4']
                laravel: ['12.*', '13.*']
                filament: ['5.*']
                include:
                    - laravel: '12.*'
                      testbench: '10.*'
                    - laravel: '13.*'
                      testbench: '11.*'

        name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · Filament ${{ matrix.filament }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3
                  coverage: none

            - name: Install dependencies
              run: |
                  composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
                  composer update --prefer-dist --no-interaction --no-progress -W

            - name: Tests
              run: vendor/bin/pest --parallel

    quality:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  coverage: none

            - run: composer install --prefer-dist --no-interaction --no-progress

            - name: Pint
              run: vendor/bin/pint --test

            - name: PHPStan
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

    e2e:
        runs-on: ubuntu-latest

        name: End to end (Playwright)

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  extensions: dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3
                  coverage: none

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22'
                  cache: npm

            - run: composer install --prefer-dist --no-interaction --no-progress

            - run: npm ci

            - run: npx playwright install --with-deps chromium

            - name: Playwright
              run: npm run test:e2e

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: failure()
              with:
                  name: playwright-results
                  path: test-results
                  retention-days: 7
