version: 2

updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      labels:
          - dependencies

    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
          semver-major-days: 14
          semver-minor-days: 7
          semver-patch-days: 3
      labels:
          - dependencies

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
          semver-major-days: 14
          semver-minor-days: 7
          semver-patch-days: 3
      labels:
          - dependencies
